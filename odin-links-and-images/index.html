<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links and Images</title>
</head>
<body>
    <h1>Homepage</h1>

    <!-- <a> stands for Anchor element, which is used to wrap a content for it to be used as a URL -->
    
    <a href="https://www.theodinproject.com/about" target="_blank" rel="noreferrer">About The Odin Project</a>

    <!-- the "href" in anchor element is the "hypertext reference" attribute for it, which is used to make the text look blue and clickable -->
    <!-- the "target" in anchor element is the attribute for it, which is used to make the link open in a different tab or window -->
    <!-- the "rel" in anchor element is the attribute for it, which is used to specify the relation between the new page and the source page -->

    <a href="./pages/about.html">About</a>
    <img src="./images/dog.jpg" alt="The Dog Logo" height="310" width="310">
    <!-- the <img> tag used for Image element is a *VOID* tag which means it has no closing brackets, but it has attributes like other tags -->
    <!-- one of the attributes is "src" which is "Source", similar to "href" which is used to specify the location or link of the image -->
    <!-- another attribute is "alt" which is "Alternate Text" to specify what to show in case the image fails load from the link or location-->
    <!-- We also size attributes such as "height" and "width" -->
</body>
</html>
