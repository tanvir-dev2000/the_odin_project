<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Odin Links and Images</title>
  </head>

  <body>
    <h1>About Page</h1>
    <img src="../images/dog.jpg" alt="The Dog Logo" height="310" width="310">

    <!-- the <img> tag used for Image element is a void tag which means it has no closing brackets, but it has attributes like other tags -->
    <!-- one of the attributes is "src", similar to "href" which is used to specify the location or link of the image -->
    <!-- another attribute is "alt" to specify what to show in case the image fails load from the link or location-->
    <!-- We also size attributes such as "height" and "width" -->


  </body>
</html>
